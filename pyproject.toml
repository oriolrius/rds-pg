[project]
name = "rds-pg"
version = "0.11.0"
description = "AWS CloudFormation stack for SQL education: PostgreSQL RDS with pre-configured JupyterLab, ready for classroom deployment"
readme = "README.md"
license = {text = "CC-BY-SA-4.0"}
requires-python = ">=3.13"
authors = [
    {name = "Oriol Rius", email = "oriol@joor.net"}
]
keywords = [
    "aws",
    "cloudformation",
    "postgresql",
    "rds",
    "jupyter",
    "jupyterlab",
    "sql",
    "education",
    "teaching",
    "database",
    "esade",
    "infrastructure-as-code"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Education",
]
dependencies = [
    "jupyterlab>=4.4.3",
    "jupysql>=0.10.17",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "toml>=0.10.2",
    "jupyterlab-sql-explorer>=0.2.1",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/oriolrius/rds-pg"
Repository = "https://github.com/oriolrius/rds-pg.git"
Issues = "https://github.com/oriolrius/rds-pg/issues"
