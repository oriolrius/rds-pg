AWSTemplateFormatVersion: '2010-09-09'
Description: 'PostgreSQL RDS with Jupyter EC2 instance for SQL practice'

Parameters:
  DBUsername:
    Type: String
    Default: postgres
    Description: Database master username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Database master password

  MyIP:
    Type: String
    Description: Your IP address for database access (e.g., 203.0.113.25)

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access to the Jupyter instance

  JupyterToken:
    Type: String
    NoEcho: true
    MinLength: 8
    Default: jupyter-sql-practice
    Description: Token/password to access Jupyter notebook

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for PostgreSQL RDS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Sub '${MyIP}/32'

  PostgreSQLDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-postgres'
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '15.15'
      AllocatedStorage: 20
      StorageType: gp2
      DBName: mydb
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      MultiAZ: false
      PubliclyAccessible: true
      StorageEncrypted: true

  # Minimal VPC setup
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for applications connecting to RDS
      VpcId: !Ref VPC

  # ============================================
  # Jupyter EC2 Instance Resources
  # ============================================

  JupyterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Jupyter EC2 instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub '${MyIP}/32'
          Description: SSH access from your IP
        - IpProtocol: tcp
          FromPort: 8888
          ToPort: 8888
          CidrIp: !Sub '${MyIP}/32'
          Description: Jupyter access from your IP
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-jupyter-sg'

  JupyterInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-jupyter-role'

  JupyterInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref JupyterInstanceRole

  JupyterInstance:
    Type: AWS::EC2::Instance
    DependsOn: PostgreSQLDB
    Properties:
      InstanceType: t3a.micro
      ImageId: !Sub 'ami-092b91d47c6c8baa5'
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref JupyterInstanceProfile
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref JupyterSecurityGroup
        - !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-jupyter'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          # Update Ubuntu 24.04
          apt-get update
          apt-get upgrade -y
          apt-get install -y curl git postgresql-client

          # Create jupyter user
          useradd -m -s /bin/bash jupyter

          # Create working directory with correct permissions
          mkdir -p /home/jupyter/notebooks
          chmod 755 /home/jupyter/notebooks

          # Create .env file with database credentials
          cat > /home/jupyter/notebooks/.env << 'ENVEOF'
          DB_HOST=${PostgreSQLDB.Endpoint.Address}
          DB_PORT=${PostgreSQLDB.Endpoint.Port}
          DB_NAME=mydb
          DB_USER=${DBUsername}
          DB_PASSWORD=${DBPassword}
          DB_ENGINE=postgres
          DB_VERSION=15.15
          ENVEOF

          # Create .python-version
          echo "3.13" > /home/jupyter/notebooks/.python-version

          # Create pyproject.toml
          cat > /home/jupyter/notebooks/pyproject.toml << 'PROJEOF'
          [project]
          name = "rds-pg"
          version = "0.11.0"
          description = "AWS CloudFormation stack for SQL education: PostgreSQL RDS with pre-configured JupyterLab"
          requires-python = ">=3.13"
          dependencies = [
              "jupyterlab>=4.4.3",
              "jupysql>=0.10.17",
              "psycopg2-binary>=2.9.11",
              "python-dotenv>=1.2.1",
              "toml>=0.10.2",
              "jupyterlab-sql-explorer>=0.2.1",
              "pandas>=2.0.0",
              "matplotlib>=3.7.0",
              "seaborn>=0.12.0",
          ]
          PROJEOF

          # Create sample notebook
          cat > /home/jupyter/notebooks/getting_started.ipynb << 'NBEOF'
          {
           "cells": [
            {
             "cell_type": "markdown",
             "metadata": {},
             "source": ["# SQL Practice - Getting Started\n", "\n", "This notebook is pre-configured to connect to your RDS PostgreSQL database."]
            },
            {
             "cell_type": "code",
             "execution_count": null,
             "metadata": {},
             "outputs": [],
             "source": ["# Load environment and connect\n", "import warnings\n", "warnings.filterwarnings('ignore', category=SyntaxWarning)\n", "\n", "import os\n", "from urllib.parse import quote_plus\n", "from dotenv import load_dotenv\n", "\n", "load_dotenv()\n", "\n", "DB_HOST = os.getenv('DB_HOST')\n", "DB_PORT = os.getenv('DB_PORT', '5432')\n", "DB_USER = os.getenv('DB_USER')\n", "DB_PASSWORD = quote_plus(os.getenv('DB_PASSWORD'))\n", "DB_NAME = os.getenv('DB_NAME')\n", "\n", "os.environ['DATABASE_URL'] = f'postgresql://{DB_USER}:{DB_PASSWORD}@{DB_HOST}:{DB_PORT}/{DB_NAME}'\n", "print(f'Connecting to: {DB_HOST}:{DB_PORT}/{DB_NAME}')"]
            },
            {
             "cell_type": "code",
             "execution_count": null,
             "metadata": {},
             "outputs": [],
             "source": ["%load_ext sql\n", "%config SqlMagic.displaylimit = 50\n", "\n", "from sqlalchemy import create_engine\n", "engine = create_engine(os.environ['DATABASE_URL'])\n", "%sql engine --alias postgres"]
            },
            {
             "cell_type": "code",
             "execution_count": null,
             "metadata": {},
             "outputs": [],
             "source": ["%%sql\n", "SELECT version();"]
            },
            {
             "cell_type": "markdown",
             "metadata": {},
             "source": ["## Ready to practice SQL!\n", "\n", "You can now write SQL queries using the `%%sql` magic command."]
            }
           ],
           "metadata": {
            "kernelspec": {
             "display_name": "Python 3",
             "language": "python",
             "name": "python3"
            }
           },
           "nbformat": 4,
           "nbformat_minor": 4
          }
          NBEOF

          # Download notebooks from GitHub
          GITHUB_RAW="https://raw.githubusercontent.com/oriolrius/rds-pg/main"
          curl -fsSL "$GITHUB_RAW/sql_practice.ipynb" -o /home/jupyter/notebooks/sql_practice.ipynb
          curl -fsSL "$GITHUB_RAW/sql_advanced_practice.ipynb" -o /home/jupyter/notebooks/sql_advanced_practice.ipynb
          curl -fsSL "$GITHUB_RAW/sales_report.ipynb" -o /home/jupyter/notebooks/sales_report.ipynb

          # Create welcome README
          cat > /home/jupyter/notebooks/README.md << 'READMEEOF'
          # SQL Practice Notebooks

          Welcome to the SQL Practice environment! This JupyterLab instance is connected to a PostgreSQL database on AWS RDS.

          ---

          ## Available Notebooks

          ### 1. [Getting Started](./getting_started.ipynb)
          **Level:** Beginner | **Duration:** 5 minutes

          Quick setup to verify your database connection. Run this first to ensure everything is working.

          ---

          ### 2. [SQL Practice](./sql_practice.ipynb)
          **Level:** Beginner to Intermediate | **Duration:** 30-45 minutes

          Learn fundamental SQL concepts: CREATE, INSERT, SELECT, WHERE, ORDER BY, GROUP BY, aggregate functions.

          ---

          ### 3. [Advanced SQL Practice](./sql_advanced_practice.ipynb)
          **Level:** Intermediate to Advanced | **Duration:** 60-90 minutes

          Master advanced SQL: JOINs, subqueries, CTEs, window functions, triggers, and transactions.

          ---

          ### 4. [Sales Report](./sales_report.ipynb)
          **Level:** Advanced | **Duration:** 30 minutes

          Business analytics with SQL and Python visualization: KPIs, charts, customer segmentation, trends.

          ---

          ## Quick Tips

          - **Run cells:** `Shift + Enter`
          - **SQL queries:** Use `%%sql` magic command
          - **View tables:** Check the SQL Explorer in the left sidebar
          READMEEOF

          # Create Jupyter config directory
          mkdir -p /home/jupyter/.jupyter
          cat > /home/jupyter/.jupyter/jupyter_lab_config.py << 'CONFEOF'
          c.ServerApp.ip = '0.0.0.0'
          c.ServerApp.port = 8888
          c.ServerApp.open_browser = False
          c.ServerApp.token = '${JupyterToken}'
          c.ServerApp.notebook_dir = '/home/jupyter/notebooks'
          c.ServerApp.allow_remote_access = True
          CONFEOF

          # Create SQL Explorer config with RDS credentials
          mkdir -p /home/jupyter/work/.database
          cat > /home/jupyter/work/.database/db_conf.json << 'SQLEOF'
          {
              "rds": {
                  "name": "rds",
                  "db_type": "2",
                  "db_id": "rds",
                  "db_host": "${PostgreSQLDB.Endpoint.Address}",
                  "db_port": "${PostgreSQLDB.Endpoint.Port}",
                  "db_user": "${DBUsername}",
                  "db_pass": "${DBPassword}",
                  "db_name": "mydb"
              }
          }
          SQLEOF

          # Set ownership BEFORE installing uv and dependencies
          chown -R jupyter:jupyter /home/jupyter

          # Install uv and dependencies as jupyter user (avoids permission issues)
          su - jupyter -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'
          su - jupyter -c 'cd /home/jupyter/notebooks && /home/jupyter/.local/bin/uv sync'

          # Initialize demo database tables
          export PGPASSWORD='${DBPassword}'
          psql -h ${PostgreSQLDB.Endpoint.Address} -U ${DBUsername} -d mydb << 'SQLEOF'
          -- Create customers table
          CREATE TABLE IF NOT EXISTS customers (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              email VARCHAR(150) UNIQUE NOT NULL,
              city VARCHAR(50) NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          -- Create products table
          CREATE TABLE IF NOT EXISTS products (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100) NOT NULL,
              price DECIMAL(10, 2) NOT NULL,
              category VARCHAR(50) NOT NULL,
              stock INTEGER NOT NULL DEFAULT 0,
              CONSTRAINT positive_price CHECK (price > 0),
              CONSTRAINT non_negative_stock CHECK (stock >= 0)
          );

          -- Create orders table
          CREATE TABLE IF NOT EXISTS orders (
              id SERIAL PRIMARY KEY,
              customer_id INTEGER NOT NULL REFERENCES customers(id),
              product_id INTEGER NOT NULL REFERENCES products(id),
              quantity INTEGER NOT NULL,
              order_date DATE NOT NULL DEFAULT CURRENT_DATE,
              status VARCHAR(20) NOT NULL DEFAULT 'pending',
              CONSTRAINT positive_quantity CHECK (quantity > 0 AND quantity <= 100),
              CONSTRAINT valid_status CHECK (status IN ('pending', 'processing', 'shipped', 'completed', 'cancelled'))
          );

          -- Insert customers (skip if already exist)
          INSERT INTO customers (name, email, city) VALUES
              ('Ana Garcia', 'ana.garcia@email.com', 'Barcelona'),
              ('John Smith', 'john.smith@email.com', 'London'),
              ('Marie Dupont', 'marie.dupont@email.com', 'Paris'),
              ('Hans Mueller', 'hans.mueller@email.com', 'Berlin'),
              ('Sofia Rossi', 'sofia.rossi@email.com', 'Milan'),
              ('Carlos Lopez', 'carlos.lopez@email.com', 'Madrid'),
              ('Emma Wilson', 'emma.wilson@email.com', 'London'),
              ('Pierre Martin', 'pierre.martin@email.com', 'Paris'),
              ('Laura Sanchez', 'laura.sanchez@email.com', 'Barcelona'),
              ('Marco Bianchi', 'marco.bianchi@email.com', 'Milan'),
              ('Inactive Customer', 'inactive@email.com', 'Amsterdam')
          ON CONFLICT (email) DO NOTHING;

          -- Insert products (skip if already exist)
          INSERT INTO products (name, price, category, stock)
          SELECT * FROM (VALUES
              ('MacBook Pro 14"', 1999.99, 'Electronics', 25),
              ('iPhone 15 Pro', 1199.99, 'Electronics', 50),
              ('Samsung Galaxy S24', 899.99, 'Electronics', 40),
              ('Sony WH-1000XM5', 349.99, 'Electronics', 100),
              ('iPad Air', 599.99, 'Electronics', 35),
              ('Apple AirPods Pro', 249.99, 'Accessories', 150),
              ('Logitech MX Master 3', 99.99, 'Accessories', 200),
              ('Samsung USB-C Hub', 49.99, 'Accessories', 300),
              ('Anker Charger 65W', 39.99, 'Accessories', 250),
              ('PlayStation 5', 499.99, 'Gaming', 15),
              ('Xbox Series X', 499.99, 'Gaming', 20),
              ('Nintendo Switch OLED', 349.99, 'Gaming', 45),
              ('Old Product', 19.99, 'Discontinued', 0)
          ) AS v(name, price, category, stock)
          WHERE NOT EXISTS (SELECT 1 FROM products LIMIT 1);

          -- Insert orders (skip if already exist)
          INSERT INTO orders (customer_id, product_id, quantity, order_date, status)
          SELECT * FROM (VALUES
              (1, 1, 1, '2026-01-05'::DATE, 'completed'),
              (1, 6, 2, '2026-01-10'::DATE, 'completed'),
              (1, 4, 1, '2026-01-20'::DATE, 'shipped'),
              (2, 2, 1, '2026-01-08'::DATE, 'completed'),
              (2, 7, 1, '2026-01-15'::DATE, 'completed'),
              (3, 1, 2, '2026-01-12'::DATE, 'completed'),
              (3, 5, 1, '2026-01-18'::DATE, 'completed'),
              (3, 6, 3, '2026-01-25'::DATE, 'processing'),
              (4, 10, 1, '2026-01-14'::DATE, 'completed'),
              (4, 12, 1, '2026-01-22'::DATE, 'shipped'),
              (5, 3, 1, '2026-01-16'::DATE, 'completed'),
              (5, 8, 2, '2026-01-24'::DATE, 'completed'),
              (6, 11, 1, '2026-01-19'::DATE, 'completed'),
              (7, 4, 1, '2026-01-21'::DATE, 'completed'),
              (7, 9, 3, '2026-01-26'::DATE, 'pending'),
              (8, 2, 1, '2026-01-23'::DATE, 'shipped'),
              (9, 5, 1, '2026-01-27'::DATE, 'pending'),
              (10, 1, 1, '2026-01-28'::DATE, 'processing'),
              (10, 6, 1, '2026-01-28'::DATE, 'processing')
          ) AS v(customer_id, product_id, quantity, order_date, status)
          WHERE NOT EXISTS (SELECT 1 FROM orders LIMIT 1);
          SQLEOF
          unset PGPASSWORD

          # Create systemd service for Jupyter using uv run
          cat > /etc/systemd/system/jupyter.service << 'SVCEOF'
          [Unit]
          Description=Jupyter Lab
          After=network.target

          [Service]
          Type=simple
          User=jupyter
          WorkingDirectory=/home/jupyter/notebooks
          Environment="PATH=/home/jupyter/.local/bin:/usr/local/bin:/usr/bin:/bin"
          ExecStart=/home/jupyter/.local/bin/uv run jupyter lab
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # Start Jupyter
          systemctl daemon-reload
          systemctl enable jupyter
          systemctl start jupyter

          # Signal completion
          echo "Jupyter setup complete" > /home/jupyter/setup-complete.txt

Outputs:
  DBEndpoint:
    Description: PostgreSQL RDS endpoint
    Value: !GetAtt PostgreSQLDB.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-db-endpoint'

  DBPort:
    Description: PostgreSQL RDS port
    Value: !GetAtt PostgreSQLDB.Endpoint.Port

  JupyterPublicIP:
    Description: Jupyter EC2 public IP address
    Value: !GetAtt JupyterInstance.PublicIp
    Export:
      Name: !Sub '${AWS::StackName}-jupyter-ip'

  JupyterURL:
    Description: Jupyter Lab URL (use your JupyterToken to login)
    Value: !Sub 'http://${JupyterInstance.PublicIp}:8888'

  SSHCommand:
    Description: SSH command to connect to the Jupyter instance
    Value: !Sub 'ssh -i ~/.ssh/${KeyPairName}.pem ubuntu@${JupyterInstance.PublicIp}'

  UploadNotebookCommand:
    Description: SCP command to upload notebooks to the instance
    Value: !Sub 'scp -i ~/.ssh/${KeyPairName}.pem your_notebook.ipynb ubuntu@${JupyterInstance.PublicIp}:/home/jupyter/notebooks/'

  EnvFileLocation:
    Description: Location of the .env file on the EC2 instance
    Value: /home/jupyter/notebooks/.env
